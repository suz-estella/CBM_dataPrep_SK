on:
  push:
    branches:
      - main
      - development
      - suz-testthat-brainstorm2
  pull_request:
    branches:
      - main
      - development

name: R-CMD-check

jobs:
  R-CMD-check:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GOOGLE_AUTH: ${{ secrets.GOOGLE_AUTH }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - uses: actions/checkout@v4

      - uses: PredictiveEcology/actions/install-spatial-deps@v0.2

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://predictiveecology.r-universe.dev/'
          Ncpus: 2
          r-version: ${{ matrix.config.r }}
          use-public-rspm: false

      - name: Install testthat R package
        run: install.packages("testthat")
        shell: Rscript {0}

      - name: Install SpaDES R packages
        run: install.packages(c("SpaDES.core", "SpaDES.project"))
        shell: Rscript {0}

      - name: Install googledrive R package
        run: install.packages("googledrive")
        shell: Rscript {0}

      - name: Run testthat::test_dir
        run: |
          library(testthat)
          library(SpaDES.core)
          library(SpaDES.project)
          testthat::test_dir("tests/testthat")
        shell: Rscript {0}

