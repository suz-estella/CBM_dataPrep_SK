on:
  push:
    branches:
      - main
      - development
      - suz-testthat-brainstorm2
  pull_request:
    branches:
      - main
      - development

name: macOS-fix

jobs:
  macOS-fix:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GOOGLE_AUTH: ${{ secrets.GOOGLE_AUTH }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - uses: actions/checkout@v4

      # 2025-01-30: systemfonts R package failed to install due to these missing
      - name: Install fontconfig (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt -y install libfontconfig1-dev
          sudo apt-get install libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
        shell: bash

      - uses: PredictiveEcology/actions/install-spatial-deps@v0.2

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://predictiveecology.r-universe.dev/'
          Ncpus: 2
          r-version: ${{ matrix.config.r }}
          use-public-rspm: false

      # 2025-01-30: R packages failed install via SpaDES.project::setupProject
      - name: Pre-install R packages for macOS
        if: runner.os == 'macOS'
        run: |
          pkgList <- list(
            "data.table", "fasterize", "magrittr", "RSQLite", "sf", "terra",
            "reproducible (>=2.1.2)" ,
            "PredictiveEcology/CBMutils@development",
            "PredictiveEcology/LandR@development"
          )
          install.packages(pkgList)
          #install.packages("Require")
          #Require::Require(pkgList)
        shell: Rscript {0}

      - name: Install testthat R package
        run: install.packages("testthat")
        shell: Rscript {0}

      - name: Install SpaDES R packages
        run: install.packages(c("SpaDES.core", "SpaDES.project"))
        shell: Rscript {0}

      - name: Install googledrive R package
        run: install.packages("googledrive")
        shell: Rscript {0}

      - name: Run testthat
        run: |
          library(SpaDES.core)
          library(SpaDES.project)
          options("Require.cloneFrom" = Sys.getenv("R_LIBS_USER"))
          testthat::test_file("tests/testthat/test-1-module_1-defaults.R", stop_on_failure = TRUE)
          testthat::test_file("tests/testthat/test-1-module_2-withAOI.R",  stop_on_failure = TRUE)
          #testthat::test_dir("tests/testthat")
        shell: Rscript {0}

